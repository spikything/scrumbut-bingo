<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f6f1">
<title>Scrumbut Bingo</title>
<script>
  (() => {
    try {
      const t = localStorage.getItem("scrumbut-bingo-theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (_) {}
  })();
</script>
<style>
  :root {
    color-scheme: light;
    --ink: #17251f;
    --muted: #64736b;
    --paper: #f4f6f1;
    --card: #ffffff;
    --line: #dce4dc;
    --green: #246b4b;
    --green-dark: #174b34;
    --accent: #246b4b;
    --mint: #d9f2e2;
    --orange: #f3b65d;
    --surface: #ffffff;
    --glow: rgba(217,242,226,.8);
    --eyebrow-bg: rgba(255,255,255,.72);
    --tile-hover-line: #a9c8b3;
    --checked-line: #75b48d;
    --icon-bg: #edf3ed;
    --icon-checked: #c1e7ce;
    --number: #91a097;
    --tick-line: #cbd6cd;
    --shadow: 22,44,31;
  }
  @media screen and (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ink: #e6eee9;
      --muted: #9aaba1;
      --paper: #0f1814;
      --card: #17231d;
      --line: #2a3a32;
      --green: #2f8a5f;
      --green-dark: #8fd4ad;
      --accent: #7cc79e;
      --mint: #1d3a2b;
      --surface: #1b2822;
      --glow: rgba(47,138,95,.18);
      --eyebrow-bg: rgba(23,35,29,.72);
      --tile-hover-line: #3f6a52;
      --checked-line: #3f8a60;
      --icon-bg: #22302a;
      --icon-checked: #2a5440;
      --number: #6f8378;
      --tick-line: #3a4c42;
      --shadow: 0,0,0;
    }
  }
  @media screen {
    :root[data-theme="dark"] {
      color-scheme: dark;
      --ink: #e6eee9;
      --muted: #9aaba1;
      --paper: #0f1814;
      --card: #17231d;
      --line: #2a3a32;
      --green: #2f8a5f;
      --green-dark: #8fd4ad;
      --accent: #7cc79e;
      --mint: #1d3a2b;
      --surface: #1b2822;
      --glow: rgba(47,138,95,.18);
      --eyebrow-bg: rgba(23,35,29,.72);
      --tile-hover-line: #3f6a52;
      --checked-line: #3f8a60;
      --icon-bg: #22302a;
      --icon-checked: #2a5440;
      --number: #6f8378;
      --tick-line: #3a4c42;
      --shadow: 0,0,0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 10% 0%, var(--glow), transparent 32rem),
      var(--paper);
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .wrap { width: min(1320px, 100% - 32px); margin: 0 auto; padding: 38px 0 48px; }
  header { text-align: center; margin-bottom: 28px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 11px; border: 1px solid var(--line); border-radius: 999px;
    color: var(--accent); background: var(--eyebrow-bg);
    font-size: .72rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
  }
  h1 { margin: 14px 0 3px; font-size: clamp(2.25rem, 6vw, 4.5rem); line-height: .98; letter-spacing: -.065em; font-weight: 950; }
  .subtitle { margin: 12px 0 0; color: var(--muted); font-size: clamp(1.05rem, 2.5vw, 1.35rem); font-weight: 650; }
  .toolbar {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    margin: 0 0 16px; flex-wrap: wrap;
  }
  .progress { color: var(--muted); font-size: .9rem; font-weight: 650; }
  .progress strong { color: var(--green-dark); font-variant-numeric: tabular-nums; }
  .actions { display: flex; gap: 8px; }
  button {
    appearance: none; border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface); color: var(--ink); padding: 9px 13px;
    font: inherit; font-size: .82rem; font-weight: 750; cursor: pointer;
  }
  button:hover { border-color: var(--green); color: var(--green-dark); }
  button:focus-visible, .tile:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }
  .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 11px; }
  .tile {
    position: relative; display: flex; flex-direction: column; align-items: flex-start;
    min-height: 156px; padding: 15px 15px 14px; border: 1px solid var(--line);
    border-radius: 15px; background: var(--card); text-align: left; cursor: pointer;
    box-shadow: 0 2px 5px rgba(var(--shadow),.035);
    transition: transform .14s ease, border-color .14s ease, background .14s ease, box-shadow .14s ease;
  }
  .tile:hover { transform: translateY(-2px); border-color: var(--tile-hover-line); box-shadow: 0 7px 18px rgba(var(--shadow),.08); }
  .tile.checked {
    background: var(--mint); border-color: var(--checked-line);
    box-shadow: inset 0 0 0 1px rgba(36,107,75,.12);
  }
  .topline { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-bottom: 11px; }
  .icon {
    display: grid; place-items: center; width: 34px; height: 34px; flex: 0 0 34px;
    border-radius: 10px; background: var(--icon-bg); font-size: 1.12rem;
  }
  .checked .icon { background: var(--icon-checked); }
  .number { color: var(--number); font-size: .68rem; font-weight: 850; letter-spacing: .08em; }
  .tick {
    position: absolute; top: 12px; right: 12px; width: 23px; height: 23px;
    display: grid; place-items: center; border: 1.5px solid var(--tick-line); border-radius: 50%;
    color: transparent; font-size: .85rem; font-weight: 900; background: var(--surface);
  }
  .checked .tick { border-color: var(--green); background: var(--green); color: white; }
  .copy { font-size: .88rem; line-height: 1.38; font-weight: 680; padding-right: 3px; }
  .copy em { color: var(--green-dark); font-style: normal; }
  .help-btn {
    display: grid; place-items: center; position: fixed; top: 12px; right: 12px; z-index: 10;
    width: 38px; height: 38px; padding: 0; border-radius: 50%;
    font-size: 1.05rem; font-weight: 900; box-shadow: 0 2px 8px rgba(var(--shadow),.12);
  }
  .theme-toggle {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    width: 66px; height: 38px; padding: 0 9px; border-radius: 999px;
    font-size: .95rem; line-height: 1; box-shadow: 0 2px 8px rgba(var(--shadow),.12);
  }
  .theme-toggle .knob {
    position: absolute; top: 4px; left: 4px; width: 28px; height: 28px;
    border-radius: 50%; background: var(--mint); border: 1px solid var(--checked-line);
    transition: transform .18s ease;
  }
  .theme-toggle[aria-checked="true"] .knob { transform: translateX(28px); }
  .theme-toggle .sun, .theme-toggle .moon { position: relative; z-index: 1; }
  .help-dialog {
    width: min(100% - 32px, 360px); padding: 0;
    border: 1px solid var(--line); border-radius: 16px;
    background: var(--card); color: var(--ink); text-align: center;
    box-shadow: 0 18px 48px rgba(var(--shadow),.22);
  }
  .help-body { padding: 22px 20px 18px; }
  .help-dialog::backdrop { background: rgba(23,37,31,.45); }
  .help-dialog h2 { margin: 0 0 8px; font-size: 1.15rem; letter-spacing: -.02em; }
  .help-dialog p { margin: 0 0 16px; color: var(--muted); font-size: .92rem; line-height: 1.45; }
  .help-dialog button { background: var(--green); border-color: var(--green); color: white; padding: 10px 22px; }
  @media (max-width: 900px) {
    .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .tile { min-height: 150px; }
  }
  @media (max-width: 650px) {
    .wrap { width: min(100% - 22px, 520px); padding-top: 17px; }
    header { margin-bottom: 22px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .tile { min-height: 142px; padding: 12px; border-radius: 12px; }
    .copy { font-size: .82rem; }
    .toolbar { flex-wrap: nowrap; }
  }
  @media (max-width: 370px) {
    .eyebrow { padding: 6px 9px; font-size: .64rem; letter-spacing: .06em; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }
  @media print {
    body { background: white; }
    .wrap { width: 100%; padding: 0; }
    .toolbar, .help-btn, .theme-toggle { display: none !important; }
    .grid { grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .tile { min-height: 130px; break-inside: avoid; box-shadow: none; }
  }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="eyebrow"><span aria-hidden="true">◈</span> Agile in name only</div>
    <h1>SCRUMBUT BINGO</h1>
    <p class="subtitle">We do Scrum, but...</p>
  </header>

  <button type="button" class="theme-toggle" id="theme" role="switch" aria-checked="false" aria-label="Dark mode"><span class="knob" aria-hidden="true"></span><span class="sun" aria-hidden="true">☀️</span><span class="moon" aria-hidden="true">🌙</span></button>
  <button type="button" class="help-btn" id="help" aria-label="How to play" aria-haspopup="dialog">?</button>
  <dialog class="help-dialog" id="help-dialog" aria-labelledby="help-title">
    <div class="help-body">
      <h2 id="help-title">How to play</h2>
      <p>Play at stand-up every day and see how many days it takes to complete ScrumBut Bingo. Tap or click a square to mark it. Your board is saved on this device. Good luck!</p>
      <form method="dialog"><button type="submit" autofocus>Got it</button></form>
    </div>
  </dialog>

  <section class="toolbar" aria-label="Bingo progress and controls">
    <div class="progress" aria-live="polite">Day <strong id="days">1</strong> <span aria-hidden="true">·</span> <strong id="count">0</strong> of 40</div>
    <div class="actions">
      <button type="button" id="print">Print</button>
      <button type="button" id="reset">Reset</button>
    </div>
  </section>

  <section class="grid" id="board" aria-label="Scrumbut bingo squares">
    <button class="tile" type="button" data-id="0" aria-pressed="false"><span class="topline"><span class="icon">🗂️</span><span class="number">01</span></span><span class="copy">The project manager decides what's going into the sprint.</span><span class="tick" aria-hidden="true">✓</span></button>
    <button class="tile" type="button" data-id="1" aria-pressed="false"><span class="topline"><span class="icon">🎯</span><span class="number">02</span></span><span class="copy">We don't estimate anything.</span><span class="tick" aria-hidden="true">✓</span></button>
    <button class="tile" type="button" data-id="2" aria-pressed="false"><span class="topline"><span class="icon">🚨</span><span class="number">03</span></span><span class="copy">Everything is a priority.</span><span class="tick" aria-hidden="true">✓</span></button>
    <button class="tile" type="button" data-id="3" aria-pressed="false"><span class="topline"><span class="icon">➕</span><span class="number">04</span></span><span class="copy">We add work to the sprint whenever someone asks.</span><span class="tick" aria-hidden="true">✓</span></button>
    <button class="tile" type="button" data-id="4" aria-pressed="false"><span class="topline"><span class="icon">📅</span><span class="number">05</span></span><span class="copy">Sprint deadlines are non-negotiable.</span><span class="tick" aria-hidden="true">✓</span></button>

    <button class="tile" type="button" data-id="5" aria-pressed="false"><span class="topline"><span class="icon">🙊</span><span class="number">06</span></span><span class="copy">Developers don't get a say in sprint commitments.</span><span class="tick" aria-hidden="true">✓</span></button>
    <button class="tile" type="button" data-id="6" aria-pressed="false"><span class="topline"><span class="icon">⏱️</span><span class="number">07</span></span><span class="copy">The stand-up takes 45 minutes.</span><span class="tick" aria-hidden="true">✓</span></button>
    <button class="tile" type="button" data-id="7" aria-pressed="false"><span class="topline"><span class="icon">📊</span><span class="number">08</span></span><span class="copy">It's really a status report to management.</span><span class="tick" aria-hidden="true">✓</span></button>
    <button class="tile" type="button" data-id="8" aria-pressed="false"><span class="topline"><span class="icon">🗣️</span><span class="number">09</span></span><span class="copy">Everyone has to explain what they did yesterday in detail.</span><span class="tick" aria-hidden="true">✓</span></button>
    <button class="tile" type="button" data-id="9" aria-pressed="false"><span class="topline"><span class="icon">🔍</span><span class="number">10</span></span><span class="copy">The Scrum Master uses it to chase people for updates.</span><span class="tick" aria-hidden="true">✓</span></button>

    <button class="tile" type="button" data-id="10" aria-pressed="false"><span class="topline"><span class="icon">🗓️</span><span class="number">11</span></span><span class="copy">We only have stand-ups when the manager is available.</span><span class="tick" aria-hidden="true">✓</span></button>
    <button class="tile" type="button" data-id="11" aria-pressed="false"><span class="topline"><span class="icon">🤐</span><span class="number">12</span></span><span class="copy">Nobody can mention blockers without proposing a solution.</span><span class="tick" aria-hidden="true">✓</span></button>
    <button class="tile" type="button" data-id="12" aria-pressed="false"><span class="topline"><span class="icon">🚢</span><span class="number">13</span></span><span class="copy">We don't release anything until the end of the project.</span><span class="tick" aria-hidden="true">✓</span></button>
    <button class="tile" type="button" data-id="13" aria-pressed="false"><span class="topline"><span class="icon">🧪</span><span class="number">14</span></span><span class="copy">Testing happens after the sprint.</span><span class="tick" aria-hidden="true">✓</span></button>
    <button class="tile" type="button" data-id="14" aria-pressed="false"><span class="topline"><span class="icon">🔁</span><span class="number">15</span></span><span class="copy">Unfinished stories automatically roll over.</span><span class="tick" aria-hidden="true">✓</span></button>

    <button class="tile" type="button" data-id="15" aria-pressed="false"><span class="topline"><span class="icon">🧭</span><span class="number">16</span></span><span class="copy">The sprint goal changes every other day.</span><span class="tick" aria-hidden="true">✓</span></button>
    <button class="tile" type="button" data-id="16" aria-pressed="false"><span class="topline"><span class="icon">🧵</span><span class="number">17</span></span><span class="copy">Developers work on several sprints simultaneously.</span><span class="tick" aria-hidden="true">✓</span></button>
    <button class="tile" type="button" data-id="17" aria-pressed="false"><span class="topline"><span class="icon">📦</span><span class="number">18</span></span><span class="copy">We're committed to a fixed scope regardless of what we learn.</span><span class="tick" aria-hidden="true">✓</span></button>
    <button class="tile" type="button" data-id="18" aria-pressed="false"><span class="topline"><span class="icon">🎭</span><span class="number">19</span></span><span class="copy">The Scrum Master is also the project manager.</span><span class="tick" aria-hidden="true">✓</span></button>
    <button class="tile" type="button" data-id="19" aria-pressed="false"><span class="topline"><span class="icon">📵</span><span class="number">20</span></span><span class="copy">The Product Owner is only available once a fortnight.</span><span class="tick" aria-hidden="true">✓</span></button>

    <button class="tile" type="button" data-id="20" aria-pressed="false"><span class="topline"><span class="icon">🚧</span><span class="number">21</span></span><span class="copy">Developers can't speak directly to stakeholders.</span><span class="tick" aria-hidden="true">✓</span></button>
    <button class="tile" type="button" data-id="21" aria-pressed="false"><span class="topline"><span class="icon">👑</span><span class="number">22</span></span><span class="copy">The tech lead makes all the technical decisions.</span><span class="tick" aria-hidden="true">✓</span></button>
    <button class="tile" type="button" data-id="22" aria-pressed="false"><span class="topline"><span class="icon">📏</span><span class="number">23</span></span><span class="copy">The business decides how long development tasks should take.</span><span class="tick" aria-hidden="true">✓</span></button>
    <button class="tile" type="button" data-id="23" aria-pressed="false"><span class="topline"><span class="icon">🧹</span><span class="number">24</span></span><span class="copy">Retrospectives are cancelled when we're busy.</span><span class="tick" aria-hidden="true">✓</span></button>
    <button class="tile" type="button" data-id="24" aria-pressed="false"><span class="topline"><span class="icon">📝</span><span class="number">25</span></span><span class="copy">Nobody ever follows up on retrospective actions.</span><span class="tick" aria-hidden="true">✓</span></button>

    <button class="tile" type="button" data-id="25" aria-pressed="false"><span class="topline"><span class="icon">📖</span><span class="number">26</span></span><span class="copy">Refinement is just someone reading tickets aloud.</span><span class="tick" aria-hidden="true">✓</span></button>
    <button class="tile" type="button" data-id="26" aria-pressed="false"><span class="topline"><span class="icon">🔒</span><span class="number">27</span></span><span class="copy">Sprint reviews are internal status meetings.</span><span class="tick" aria-hidden="true">✓</span></button>
    <button class="tile" type="button" data-id="27" aria-pressed="false"><span class="topline"><span class="icon">📆</span><span class="number">28</span></span><span class="copy">We have a daily meeting for every team and project.</span><span class="tick" aria-hidden="true">✓</span></button>
    <button class="tile" type="button" data-id="28" aria-pressed="false"><span class="topline"><span class="icon">⏳</span><span class="number">29</span></span><span class="copy">We don't have time to do Scrum properly.</span><span class="tick" aria-hidden="true">✓</span></button>
    <button class="tile" type="button" data-id="29" aria-pressed="false"><span class="topline"><span class="icon">🧱</span><span class="number">30</span></span><span class="copy">We've always done it this way.</span><span class="tick" aria-hidden="true">✓</span></button>

    <button class="tile" type="button" data-id="30" aria-pressed="false"><span class="topline"><span class="icon">🌀</span><span class="number">31</span></span><span class="copy">“We're Agile, not Scrum.”</span><span class="tick" aria-hidden="true">✓</span></button>
    <button class="tile" type="button" data-id="31" aria-pressed="false"><span class="topline"><span class="icon">🤸</span><span class="number">32</span></span><span class="copy">“We need to be more agile about following the process.”</span><span class="tick" aria-hidden="true">✓</span></button>
    <button class="tile" type="button" data-id="32" aria-pressed="false"><span class="topline"><span class="icon">🛋️</span><span class="number">33</span></span><span class="copy">“Let's take that offline.”</span><span class="tick" aria-hidden="true">✓</span></button>
    <button class="tile" type="button" data-id="33" aria-pressed="false"><span class="topline"><span class="icon">🤏</span><span class="number">34</span></span><span class="copy">“Can we just squeeze this into the sprint?”</span><span class="tick" aria-hidden="true">✓</span></button>
    <button class="tile" type="button" data-id="34" aria-pressed="false"><span class="topline"><span class="icon">🐜</span><span class="number">35</span></span><span class="copy">“It's only a small change.”</span><span class="tick" aria-hidden="true">✓</span></button>

    <button class="tile" type="button" data-id="35" aria-pressed="false"><span class="topline"><span class="icon">🧾</span><span class="number">36</span></span><span class="copy">“We'll fix the technical debt next sprint.”</span><span class="tick" aria-hidden="true">✓</span></button>
    <button class="tile" type="button" data-id="36" aria-pressed="false"><span class="topline"><span class="icon">📈</span><span class="number">37</span></span><span class="copy">“We need to improve velocity.”</span><span class="tick" aria-hidden="true">✓</span></button>
    <button class="tile" type="button" data-id="37" aria-pressed="false"><span class="topline"><span class="icon">🗓️</span><span class="number">38</span></span><span class="copy">“Let's have a meeting about why we have too many meetings.”</span><span class="tick" aria-hidden="true">✓</span></button>
    <button class="tile" type="button" data-id="38" aria-pressed="false"><span class="topline"><span class="icon">⚖️</span><span class="number">39</span></span><span class="copy">“The sprint is committed, but nothing is guaranteed.”</span><span class="tick" aria-hidden="true">✓</span></button>
    <button class="tile" type="button" data-id="39" aria-pressed="false"><span class="topline"><span class="icon">📚</span><span class="number">40</span></span><span class="copy">“We don't do documentation because we're Agile.”</span><span class="tick" aria-hidden="true">✓</span></button>
  </section>
</main>
<script>
(() => {
  "use strict";
  const KEY = "scrumbut-bingo-checked-v1";
  const tiles = Array.from(document.querySelectorAll(".tile"));
  const count = document.getElementById("count");
  const START_KEY = "scrumbut-bingo-start-v1";
  const days = document.getElementById("days");

  function today() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function dayNumber(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    const now = new Date();
    const diff = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - Date.UTC(y, m - 1, d);
    return Math.max(1, Math.floor(diff / 86400000) + 1);
  }

  function readStart() {
    try {
      const value = localStorage.getItem(START_KEY);
      if (value && /^\d{4}-\d{2}-\d{2}$/.test(value)) return value;
    } catch (_) {}
    return null;
  }

  function saveStart(value) {
    try { localStorage.setItem(START_KEY, value); } catch (_) {}
  }

  let start = readStart();
  if (!start) { start = today(); saveStart(start); }

  function readSaved() {
    try {
      const value = JSON.parse(localStorage.getItem(KEY) || "[]");
      return new Set(Array.isArray(value) ? value.filter(n => Number.isInteger(n) && n >= 0 && n < tiles.length) : []);
    } catch (_) {
      return new Set();
    }
  }

  let checked = readSaved();

  function render() {
    tiles.forEach((tile, index) => {
      const active = checked.has(index);
      tile.classList.toggle("checked", active);
      tile.setAttribute("aria-pressed", String(active));
    });
    count.textContent = String(checked.size);
    days.textContent = String(dayNumber(start));
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(Array.from(checked))); }
    catch (_) { /* The board remains usable if storage is unavailable. */ }
  }

  tiles.forEach((tile, index) => {
    tile.addEventListener("click", () => {
      if (checked.has(index)) checked.delete(index);
      else checked.add(index);
      save();
      render();
    });
  });

  document.getElementById("reset").addEventListener("click", () => {
    if (!checked.size || window.confirm("Clear all checked squares and restart the day count?")) {
      checked.clear();
      save();
      start = today();
      saveStart(start);
      render();
    }
  });

  document.getElementById("print").addEventListener("click", () => window.print());
  const THEME_KEY = "scrumbut-bingo-theme";
  const themeBtn = document.getElementById("theme");
  const themeMeta = document.querySelector('meta[name="theme-color"]');
  const darkQuery = window.matchMedia("(prefers-color-scheme: dark)");
  function isDark() {
    const forced = document.documentElement.dataset.theme;
    return forced ? forced === "dark" : darkQuery.matches;
  }
  function syncTheme() {
    const dark = isDark();
    themeBtn.setAttribute("aria-checked", String(dark));
    themeMeta.setAttribute("content", dark ? "#0f1814" : "#f4f6f1");
  }
  themeBtn.addEventListener("click", () => {
    const next = isDark() ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem(THEME_KEY, next); } catch (_) {}
    syncTheme();
  });
  darkQuery.addEventListener("change", syncTheme);
  syncTheme();

  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

  const HELP_KEY = "scrumbut-bingo-help-seen-v1";
  const helpDialog = document.getElementById("help-dialog");
  function openHelp() {
    if (typeof helpDialog.showModal === "function") helpDialog.showModal();
    else window.alert(helpDialog.querySelector("p").textContent);
  }
  document.getElementById("help").addEventListener("click", openHelp);
  helpDialog.addEventListener("click", e => { if (e.target === helpDialog) helpDialog.close(); });
  let seen = false;
  try { seen = localStorage.getItem(HELP_KEY) === "1"; } catch (_) {}
  if (!seen) {
    openHelp();
    try { localStorage.setItem(HELP_KEY, "1"); } catch (_) {}
  }
  render();
})();
</script>
</body>
</html>
